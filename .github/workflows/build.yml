name: Build and deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - 'deploy/k8s/**'
      - '*.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/${{ github.repository_owner }}/freeframe-api
  WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/freeframe-web

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tag
        id: tag
        run: echo "sha=${GITHUB_SHA::12}" >> $GITHUB_OUTPUT

      - name: Build and push api
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile.prod
          push: true
          tags: |
            ${{ env.API_IMAGE }}:${{ steps.tag.outputs.sha }}
            ${{ env.API_IMAGE }}:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build and push web
        uses: docker/build-push-action@v5
        with:
          context: ./apps/web
          file: apps/web/Dockerfile.prod
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=/api
            NEXT_PUBLIC_UPLOAD_CONCURRENCY=5
          tags: |
            ${{ env.WEB_IMAGE }}:${{ steps.tag.outputs.sha }}
            ${{ env.WEB_IMAGE }}:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Update k8s manifest with new image tags
        run: |
          SHA=${{ steps.tag.outputs.sha }}
          sed -i -E "s|image: ${API_IMAGE}:.*|image: ${API_IMAGE}:${SHA}|" deploy/k8s/freeframe.yaml
          sed -i -E "s|image: ${WEB_IMAGE}:.*|image: ${WEB_IMAGE}:${SHA}|" deploy/k8s/freeframe.yaml

      - name: Commit manifest updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet deploy/k8s; then
            echo "No manifest changes"
            exit 0
          fi
          git add deploy/k8s/freeframe.yaml
          git commit -m "chore: bump images to ${{ steps.tag.outputs.sha }}"
          git push
